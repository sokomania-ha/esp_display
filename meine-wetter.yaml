# meine-wetter.yaml
# Seite 1: Aktuelle Messwerte (DWD Freudenstadt)
# Seite 2: Vorhersage-Werte

lvgl:
  pages:

    # ── SEITE 1: AKTUELLE MESSWERTE ────────────────────────────────────────
    - id: wetter_aktuell
      bg_color: 0x000000
      pad_all: 0
      on_load:
        - lvgl.label.update:
            id: page_title
            text: "Wetter Aktuell"
      widgets:
        - obj:
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            pad_top: 50
            pad_bottom: 50
            pad_left: 6
            pad_right: 6
            width: 100%
            height: 100%
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: START
              flex_align_cross: START
              flex_align_track: START
              pad_column: 8
              pad_row: 8
            widgets:

              # ── TEMPERATUR (gross, breit) ─────────────────────────
              - obj:
                  id: wetter_temp_widget
                  width: 100%
                  height: 56
                  bg_color: 0x1A3A5A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Temperatur"
                        align: LEFT_MID
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_temp_wert
                        text: "--.-C"
                        align: RIGHT_MID
                        text_font: roboto_xl
                        text_color: 0x00CFFF

              # ── WETTERZUSTAND ─────────────────────────────────────
              - obj:
                  id: wetter_zustand_widget
                  width: 100%
                  height: 40
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Zustand:"
                        align: LEFT_MID
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_zustand_wert
                        text: "---"
                        align: RIGHT_MID
                        text_font: roboto_sm
                        text_color: 0xFFFFFF

              # ── WIND ──────────────────────────────────────────────
              - obj:
                  id: wetter_wind_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Wind"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_wind_wert
                        text: "-- km/h"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0xFFFFFF

              # ── WINDBOEEN ─────────────────────────────────────────
              - obj:
                  id: wetter_boeen_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Boeen"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_boeen_wert
                        text: "-- km/h"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0xFF8800

              # ── NIEDERSCHLAG ──────────────────────────────────────
              - obj:
                  id: wetter_regen_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Niederschlag"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_regen_wert
                        text: "-- mm"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0x88CCFF

              # ── BEWOELKUNG ────────────────────────────────────────
              - obj:
                  id: wetter_wolken_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Bewoelkung"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: wetter_wolken_wert
                        text: "--%"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0xCCCCCC

    # ── SEITE 2: VORHERSAGE ────────────────────────────────────────────────
    - id: wetter_vorhersage
      bg_color: 0x000000
      pad_all: 0
      on_load:
        - lvgl.label.update:
            id: page_title
            text: "Wetter Vorhersage"
      widgets:
        - obj:
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            pad_top: 50
            pad_bottom: 50
            pad_left: 6
            pad_right: 6
            width: 100%
            height: 100%
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: START
              flex_align_cross: START
              flex_align_track: START
              pad_column: 8
              pad_row: 8
            widgets:

              # ── REGENWAHRSCHEINLICHKEIT ───────────────────────────
              - obj:
                  id: vhs_regen_widget
                  width: 49%
                  height: 72
                  bg_color: 0x1A3A5A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Regen"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_regen_wert
                        text: "--%"
                        align: BOTTOM_LEFT
                        text_font: roboto_xl
                        text_color: 0x88CCFF

              # ── NEBELWAHRSCHEINLICHKEIT ───────────────────────────
              - obj:
                  id: vhs_nebel_widget
                  width: 49%
                  height: 72
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Nebel"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_nebel_wert
                        text: "--%"
                        align: BOTTOM_LEFT
                        text_font: roboto_xl
                        text_color: 0xCCCCCC

              # ── UV-INDEX ──────────────────────────────────────────
              - obj:
                  id: vhs_uv_widget
                  width: 49%
                  height: 72
                  bg_color: 0x3A2A0A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "UV-Index"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_uv_wert
                        text: "--"
                        align: BOTTOM_LEFT
                        text_font: roboto_xl
                        text_color: 0xFFD700

              # ── SONNENSCHEIN ──────────────────────────────────────
              - obj:
                  id: vhs_sonne_widget
                  width: 49%
                  height: 72
                  bg_color: 0x3A2A0A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Sonnenschein"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_sonne_wert
                        text: "-- h"
                        align: BOTTOM_LEFT
                        text_font: roboto_xl
                        text_color: 0xFFAA00

              # ── SICHTWEITE ────────────────────────────────────────
              - obj:
                  id: vhs_sicht_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Sichtweite"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_sicht_wert
                        text: "-- km"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0xFFFFFF

              # ── SONNENEINSTRAHLUNG ────────────────────────────────
              - obj:
                  id: vhs_strahlung_widget
                  width: 49%
                  height: 64
                  bg_color: 0x2A3A4A
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Strahlung"
                        align: TOP_LEFT
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: vhs_strahlung_wert
                        text: "-- W/m2"
                        align: BOTTOM_LEFT
                        text_font: roboto_md
                        text_color: 0xFFCC44

              # ── NINA WARNUNG ──────────────────────────────────────
              - obj:
                  id: nina_widget
                  width: 100%
                  height: 40
                  bg_color: 0x3A0000
                  radius: 16
                  border_width: 0
                  pad_all: 8
                  widgets:
                    - label:
                        text: "Warnung:"
                        align: LEFT_MID
                        text_font: roboto_sm
                        text_color: 0xAAAAAA
                    - label:
                        id: nina_wert
                        text: "Keine"
                        align: RIGHT_MID
                        text_font: roboto_sm
                        text_color: 0x44FF44

packages:
  wetter_sensors: !include meine-wetter-sensors.yaml
